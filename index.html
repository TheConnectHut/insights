<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insights</title>
<style>
  /* ============ DESIGN TOKENS (from ankahee-design-tokens.css) ============ */
  :root {
    --bg: #FAF6F2;
    --surface: #FFFFFF;
    --surface-soft: #F3EEE8;
    --primary: #5B4B7C;
    --primary-dark: #443A5E;
    --primary-soft: #EDE8F3;
    --success: #4F8A6D;
    --success-soft: #E7F1EB;
    --risk: #B8524A;
    --risk-soft: #F7E9E7;
    --text: #2E2A33;
    --text-muted: #7A7480;
    --border: #E4DDD6;
    --radius: 14px;
    --radius-sm: 10px;
    --shadow: 0 2px 10px rgba(46, 42, 51, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--primary); }
  [hidden] { display: none !important; }

  /* ============ HEADER ============ */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 12px; display: flex; align-items: center; gap: 8px; min-height: 58px;
  }
  .icon-btn {
    width: 44px; height: 44px; border: none; background: none; border-radius: 999px;
    font-size: 28px; line-height: 1; color: var(--primary); cursor: pointer; flex-shrink: 0;
  }
  .icon-btn:active { background: var(--primary-soft); }
  .icon-btn.refresh { font-size: 24px; }
  .icon-btn.spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hdr-title { flex: 1; min-width: 0; padding-left: 4px; }
  .hdr-title .title { font-size: 16px; font-weight: 700; color: var(--primary-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-title .subtitle { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr-logo { height: 32px; width: auto; max-width: 96px; border-radius: 6px; flex-shrink: 0; }
  #hActions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  /* ============ LAYOUT ============ */
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 120px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px;
  }
  .card-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--primary-dark); margin: 0 0 10px 0; display: flex; justify-content: space-between; align-items: center;
  }
  .card-title .link-btn { text-transform: none; letter-spacing: 0; font-size: 14px; }
  .muted { color: var(--text-muted); }
  .small { font-size: 13px; }
  .center { text-align: center; }
  .loading-note, .empty { text-align: center; padding: 36px 16px; color: var(--text-muted); font-size: 15px; }
  .empty .btn { margin-top: 12px; }

  /* ============ BUTTONS ============ */
  .btn {
    min-height: 44px; padding: 10px 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--primary);
    background: var(--surface); color: var(--primary); font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .btn:active { background: var(--primary-soft); }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:active { background: var(--primary-dark); }
  .btn-sm { min-height: 44px; padding: 8px 14px; font-size: 14px; border-radius: 999px; }
  .btn:disabled { opacity: 0.5; }
  .link-btn { background: none; border: none; color: var(--primary); font-weight: 600; font-size: 15px; cursor: pointer; padding: 10px 4px; min-height: 44px; font-family: inherit; text-decoration: underline; text-underline-offset: 3px; }

  /* ============ BOTTOM BAR ============ */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface);
    border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .bar-inner { max-width: 720px; margin: 0 auto; display: flex; gap: 10px; }
  .bar-inner .btn { flex: 1; min-height: 50px; font-size: 16px; font-weight: 700; }
  .bar-error { max-width: 720px; margin: 0 auto 8px; font-size: 13px; color: var(--risk); text-align: center; display: none; }

  /* ============ TABS, SEARCH, FILTERS ============ */
  .identity-bar {
    display: flex; align-items: center; justify-content: space-between; background: var(--primary-soft);
    border-radius: var(--radius-sm); padding: 4px 6px 4px 14px; margin-bottom: 14px; font-size: 14px;
  }
  .identity-bar strong { color: var(--primary-dark); }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .tab {
    padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface);
    font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; min-height: 44px; white-space: nowrap; font-family: inherit;
  }
  .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .searchrow { display: flex; gap: 8px; margin-bottom: 10px; }
  .searchrow input { flex: 1; }
  .filter-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .filter-panel .field { margin: 0; }
  .filter-panel .wide { grid-column: 1 / -1; text-align: right; }
  .count-line { font-size: 13px; color: var(--text-muted); margin: 4px 2px 10px; }

  /* ============ LIST ROWS ============ */
  .list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; margin-bottom: 14px; }
  .row { display: block; padding: 14px 16px; border-bottom: 1px solid var(--border); text-decoration: none; color: inherit; min-height: 44px; }
  .row:last-child { border-bottom: none; }
  a.row:active { background: var(--primary-soft); }
  .row-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .row-title { font-weight: 600; font-size: 16px; color: var(--text); }
  .row-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .row-tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }

  /* ============ BADGES ============ */
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--surface-soft); color: var(--text); white-space: nowrap;
  }
  .st-new { background: var(--primary-soft); color: var(--primary-dark); }
  .st-prog { background: var(--primary); color: #fff; }
  .st-conv { background: var(--success-soft); color: var(--success); }
  .st-ni { background: var(--surface-soft); color: var(--text-muted); }
  .cold { background: var(--risk-soft); color: var(--risk); }
  .tag { background: var(--primary-soft); color: var(--primary-dark); }

  /* ============ ORGANISATION PAGE ============ */
  .org-name { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .contact { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .contact:last-child { border-bottom: none; padding-bottom: 0; }
  .contact:first-child { padding-top: 0; }
  .c-name { font-weight: 600; }
  .c-role { font-size: 13px; color: var(--text-muted); }
  .c-links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 2px; }
  .c-links a { display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; }
  .about-text, .pre { white-space: pre-wrap; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 14px; }
  .kv dt { color: var(--text-muted); } .kv dd { margin: 0; }
  .int { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .int:last-child { border-bottom: none; padding-bottom: 0; }
  .int:first-child { padding-top: 0; }
  .int-top { font-size: 13px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .int-top b { color: var(--text); }
  .int-edit { margin: -12px -4px -12px 0; flex-shrink: 0; font-size: 14px; }
  .int-sum { margin-top: 3px; white-space: pre-wrap; }
  .int-next { margin-top: 4px; font-size: 14px; white-space: pre-wrap; }
  .overdue { color: var(--risk); font-weight: 600; }
  .meta { font-size: 13px; color: var(--text-muted); }
  .meta-actions { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
  .banner { background: var(--risk-soft); border: 1px solid #E9C9C5; border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
  .banner.soft { background: var(--primary-soft); border-color: var(--border); }
  .banner ul { margin: 6px 0 0; padding-left: 18px; }

  /* ============ FORMS ============ */
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .field-label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  .field-label .optional { font-weight: 400; color: var(--text-muted); font-size: 12px; margin-left: 4px; }
  select, input[type="text"], input[type="date"], input[type="search"], input[type="url"] {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    font-size: 16px; background: var(--surface); color: var(--text); min-height: 46px; font-family: inherit;
  }
  textarea {
    width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
    font-size: 16px; font-family: inherit; min-height: 80px; resize: vertical; background: var(--surface); color: var(--text);
  }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface);
    font-size: 14px; color: var(--text); cursor: pointer; min-height: 44px; display: flex; align-items: center;
    user-select: none; font-family: inherit;
  }
  .chip:active { transform: scale(0.97); }
  .chip.selected { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 600; }
  .chips[data-multi] .chip.selected::before { content: "✓"; margin-right: 6px; font-weight: 700; }
  .chip.disabled { opacity: 0.45; cursor: default; text-decoration: line-through; }
  .field.flash { outline: 2px solid var(--risk); border-radius: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .check-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 44px; border-bottom: 1px solid var(--border); }
  .check-row:last-child { border-bottom: none; }
  .check-row input { width: 24px; height: 24px; accent-color: var(--primary); flex-shrink: 0; }
  .check-row .grow { flex: 1; min-width: 0; }
  .dupbox { background: var(--primary-soft); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .dupbox a.row { background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 8px; }
  .dupbox .btns { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }

  .combo { position: relative; }
  .combo-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 240px; overflow-y: auto; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow); z-index: 25; }
  .combo-item { padding: 10px 14px; min-height: 44px; cursor: pointer; display: flex; flex-direction: column; justify-content: center; }
  .combo-item:active, .combo-item:hover { background: var(--primary-soft); }
  .combo-item .s { font-size: 12px; color: var(--text-muted); }
  .combo-empty { padding: 12px 14px; color: var(--text-muted); font-size: 14px; }

  /* ============ SHEET, TOAST, CONFIRM ============ */
  .sheet-back { position: fixed; inset: 0; background: rgba(46, 42, 51, 0.35); z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--surface); width: 100%; max-width: 720px; border-radius: var(--radius) var(--radius) 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet .btn { width: 100%; margin-bottom: 10px; }
  .sheet .btn:last-child { margin-bottom: 0; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--primary-dark); color: #fff; padding: 12px 18px; border-radius: 999px; font-size: 14px; z-index: 90; max-width: 90%; box-shadow: var(--shadow); }
  .confirm-overlay { position: fixed; inset: 0; background: rgba(46, 42, 51, 0.35); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .confirm-overlay.show { display: flex; }
  .confirm-card { background: var(--surface); border-radius: var(--radius); padding: 32px 28px; text-align: center; max-width: 320px; box-shadow: 0 8px 30px rgba(46,42,51,0.15); }
  .confirm-check { width: 56px; height: 56px; border-radius: 50%; background: var(--success-soft); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
  .confirm-check svg { width: 28px; height: 28px; }
  .confirm-check circle { stroke: var(--success); stroke-width: 2; fill: none; stroke-dasharray: 63; stroke-dashoffset: 63; animation: circleDraw 0.5s ease forwards; }
  .confirm-check path { stroke: var(--success); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; animation: checkDraw 0.3s ease forwards 0.45s; }
  @keyframes circleDraw { to { stroke-dashoffset: 0; } }
  @keyframes checkDraw { to { stroke-dashoffset: 0; } }
  .confirm-title { font-size: 17px; font-weight: 700; margin: 0 0 6px; }
  .confirm-sub { font-size: 14px; color: var(--text-muted); margin: 0; }

  /* ============ FEATURE SPEC TABLE ============ */
  .spec-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  table.spec { border-collapse: collapse; min-width: 1100px; font-size: 13px; }
  table.spec th { text-align: left; background: var(--primary-soft); color: var(--primary-dark); padding: 10px; position: sticky; top: 0; }
  table.spec td { vertical-align: top; padding: 10px; border-top: 1px solid var(--border); }
  .spec-view main, body.spec-view main { max-width: none; }

  @media (prefers-reduced-motion: reduce) { .confirm-check circle, .confirm-check path { animation: none; stroke-dashoffset: 0; } .icon-btn.spin { animation: none; } }
</style>
<style>
  /* ---- Insights-only styles (same tokens as above) ---- */
  .fn-row { margin-bottom: 14px; }
  .fn-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .fn-name { font-weight: 600; font-size: 15px; }
  .fn-num { font-weight: 700; font-size: 18px; color: var(--primary-dark); }
  .fn-num small { font-weight: 500; font-size: 13px; color: var(--text-muted); margin-left: 6px; }
  .fn-track { background: var(--surface-soft); border-radius: 999px; height: 16px; overflow: hidden; }
  .fn-bar { height: 100%; border-radius: 999px; background: var(--primary); min-width: 6px; }
  .fn-bar.first { background: var(--primary-soft); border: 1px solid var(--primary); }
  .fn-bar.won { background: var(--success); }
  .fn-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stat { background: var(--surface-soft); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
  .stat b { display: block; font-size: 24px; color: var(--primary-dark); }
  .stat span { font-size: 13px; color: var(--text-muted); }
  .stat.warn b { color: var(--risk); }
  .names { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  .lost-line { padding: 6px 0; }
  table.mini { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.mini th { text-align: right; font-weight: 600; color: var(--text-muted); padding: 6px 4px; font-size: 12px; }
  table.mini th:first-child, table.mini td:first-child { text-align: left; }
  table.mini td { text-align: right; padding: 8px 4px; border-top: 1px solid var(--border); }
  .period-custom { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .filters { margin-bottom: 14px; }
  .filters .field { margin-bottom: 12px; }
  .asof { font-size: 13px; color: var(--text-muted); margin: 0 2px 12px; }
</style>
<style>
  /* ---- Training view styles (same tokens) ---- */
  .view-tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; }
  .period-step { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 2px 0 6px; }
  .period-step .label { font-weight: 700; color: var(--primary-dark); text-align: center; flex: 1; }
  .step-btn { width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--surface); color: var(--primary); font-size: 20px; cursor: pointer; font-family: inherit; }
  .step-btn:disabled { opacity: 0.35; cursor: default; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .tile { text-align: left; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; font-family: inherit; color: var(--text); min-height: 44px; box-shadow: var(--shadow); }
  .tile.selected { border-color: var(--primary); background: var(--primary-soft); }
  .tile .t-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .tile .t-num { display: block; font-size: 22px; font-weight: 700; color: var(--primary-dark); margin: 2px 0; }
  .tile .t-chg { font-size: 12px; font-weight: 600; }
  .t-up { color: var(--success); } .t-down { color: var(--risk); } .t-flat { color: var(--text-muted); }
  .tiles-note { font-size: 12px; color: var(--text-muted); margin: 0 2px 14px; }
  .fchips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .fchip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 8px 6px 14px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 14px; font-weight: 600; border: none; cursor: pointer; font-family: inherit; }
  .fchip .x { font-size: 18px; line-height: 1; opacity: 0.85; }
  .fchip small { font-weight: 400; opacity: 0.85; }
  .dimchips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .dimchips .chip.dim-off { opacity: 0.4; cursor: default; }
  .trend { display: flex; align-items: flex-end; gap: 6px; height: 150px; overflow-x: auto; padding-top: 18px; }
  .trend .col { flex: 1 0 28px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-width: 28px; }
  .trend .v { font-size: 11px; color: var(--text-muted); white-space: nowrap; margin-bottom: 2px; }
  .trend .b { width: 70%; max-width: 38px; background: var(--primary); border-radius: 6px 6px 0 0; min-height: 3px; }
  .trend .b.zero { background: var(--border); }
  .trend-labels { display: flex; gap: 6px; overflow-x: hidden; }
  .trend-labels span { flex: 1 0 28px; min-width: 28px; text-align: center; font-size: 11px; color: var(--text-muted); }
  .vb-row { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--border); padding: 10px 2px; cursor: pointer; font-family: inherit; color: var(--text); min-height: 44px; }
  .vb-row:last-child { border-bottom: none; }
  .vb-row:active { background: var(--primary-soft); }
  .vb-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; margin-bottom: 4px; }
  .vb-name { font-weight: 600; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
  .vb-num { font-weight: 700; color: var(--primary-dark); white-space: nowrap; }
  .vb-num small { font-weight: 500; color: var(--text-muted); margin-left: 6px; }
  .vb-track { background: var(--surface-soft); border-radius: 999px; height: 12px; overflow: hidden; }
  .vb-bar { height: 100%; border-radius: 999px; background: var(--primary); min-width: 4px; }
  .notice { background: var(--surface-soft); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
</style>
</head>
<body>

<header id="hdr">
  <img id="hLogo" class="hdr-logo" alt="" hidden>
  <div class="hdr-title"><div class="title" id="hTitle"></div><div class="subtitle" id="hSub"></div></div>
  <div id="hActions"></div>
</header>
<main id="view"><div class="loading-note">Loading…</div></main>
<div class="bar" id="bar" hidden></div>
<div class="confirm-overlay" id="confirmOverlay"><div class="confirm-card"><p class="confirm-title" id="confirmTitle"></p></div></div>

<script>
'use strict';
/* ====================================================================
   Insights — read-only views for founders and core members (one HTML file), v4
   Built from separate source files joined at build time: head, core,
   registry, pipeline view, training view, tail. Each view is one isolated
   block with its own spec tags (Pipeline: I02, I03, I05; Training: I10 to
   I17); deleting a view's file removes the view. The Feature Spec is
   generated from the spec tags at build time.
   Pipeline reads the company's CRM web app (action getInsights); Training
   reads the company's Training web app (action getTrainingInsights). Each
   web app accepts its Insights Team Key for that one read action only.
   v4: view registry and switcher (I09), Training view (I10 to I17).
   v3: Moved ahead is listed one row per stage (see I03).
   v2: Needs attention (I04), By product (I06) and Copy summary (I07) were
   removed and their numbers are not reused.
   ==================================================================== */

// ==== PURE BEGIN (core: no page access; tested on its own) ====
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : (many || one + 's')); }
function parseD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : NaN; }
function daysBetween(a, b) { return Math.round((parseD(b) - parseD(a)) / 86400000); }
function addDays(s, n) { return new Date(parseD(s) + n * 86400000).toISOString().slice(0, 10); }
function fmtD(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? (+m[3]) + ' ' + MON[+m[2] - 1] + ' ' + m[1] : ''; }
function fmtShort(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? (+m[3]) + ' ' + MON[+m[2] - 1] : ''; }
// ==== PURE END ====

  set(ns, k, v) { try { localStorage.setItem(this.k(ns, k), v); } catch (e) { mem[this.k(ns, k)] = v; } },

async function api(view, action) {

  let json;

  if (!json.ok) throw new Error(json.error || 'Something went wrong.');

}
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => { const x = (pa >> s) & 255, y = (pb >> s) & 255; return Math.round(x + (y - x) * t); };
  return '#' + [16, 8, 0].map(s => ch(s).toString(16).padStart(2, '0')).join('');

/* ====================================================================
   PIPELINE VIEW (I02, I03, I05) — reads the CRM web app, action getInsights.
   Moved into the registry unchanged in v4; only where it keeps its data
   changed (PL.data and PL.ui instead of S.data and S.ui).
   ==================================================================== */
const PL = { data: null, ui: { campaign: null, period: '7', from: '', to: '' } };

// ==== PURE BEGIN (pipeline) ====
// Period: Last 7 days and Last 30 days roll back from today (today included); This week runs Monday to today.
function periodRange(kind, today, cFrom, cTo) {
  if (kind === 'week') { const dow = new Date(parseD(today)).getUTCDay(); return { from: addDays(today, -((dow + 6) % 7)), to: today }; }
  if (kind === '30') return { from: addDays(today, -29), to: today };
  if (kind === 'custom') {
    let f = cFrom || today, t = cTo || today;
    if (f > t) { const x = f; f = t; t = x; }
    return { from: f, to: t };
  }
  return { from: addDays(today, -6), to: today };
}
function periodLabel(r) { return r.from === r.to ? fmtD(r.from) : fmtShort(r.from) + ' to ' + fmtD(r.to); }

function computeInsights(data, opts) {
  opts = opts || {};
  const today = data.config.today;
  const stages = data.lists.stage, kinds = data.lists.stageKind || {};
  const kindOf = s => kinds[s] || '';
  const funnelStages = stages.filter(s => kindOf(s) === 'Open' || kindOf(s) === 'Won');
  const fi = {}; funnelStages.forEach((s, i) => { fi[s] = i; });
  const first = funnelStages[0] || '';
  const orgById = {}; data.orgs.forEach(o => { orgById[o['Org ID']] = o; });
  function resolve(id) { for (let h = 0; h < 6; h++) { const o = orgById[id]; if (o && o['Record Status'] === 'Archived' && o['Archived To']) id = o['Archived To']; else break; } return id; }
  const orgName = id => { const o = orgById[resolve(id)]; return o ? o['Org Name'] : id; };
  const prodName = {}; data.products.forEach(p => { prodName[p['Product ID']] = p['Product Name']; });
  const E = data.engagements.filter(e => !opts.campaign || e['Campaign ID'] === opts.campaign);
  const histBy = {};
  data.stageHistory.forEach(h => { (histBy[h['Engagement ID']] = histBy[h['Engagement ID']] || []).push(h); });
  const range = opts.range || periodRange('7', today);

  const reached = funnelStages.map(() => 0), nowHere = funnelStages.map(() => 0);
  const lostBy = {}; // lost stage -> { total, left: {stage: n} }
  const outcome = {}; // college -> { bucket, stage }: its last change in the period
  const prods = {};
  E.forEach(e => {
    const id = e['Engagement ID'], cur = e['Stage'];
    if (e['Product ID']) prods[e['Product ID']] = prodName[e['Product ID']] || e['Product ID'];
    let rows = (histBy[id] || []).slice().sort((a, b) => (a['Changed On'] + a['Log ID']).localeCompare(b['Changed On'] + b['Log ID']))
      .map(h => ({ from: h['From Stage'], to: h['To Stage'], on: h['Changed On'] || '' }));
    if (!rows.length) rows = [{ from: '', to: cur, on: e['Stage Changed On'] || e['Start Date'] || '' }];
    let far = 0;
    rows.forEach(r => [r.from, r.to].forEach(s => { if (fi[s] !== undefined) far = Math.max(far, fi[s]); }));
    if (fi[cur] !== undefined) far = Math.max(far, fi[cur]);
    for (let i = 0; i <= far; i++) reached[i]++;
    if (fi[cur] !== undefined) nowHere[fi[cur]]++;
    if (kindOf(cur) === 'Lost') {
      const lb = lostBy[cur] = lostBy[cur] || { total: 0, left: {} };
      lb.total++;
      const lr = rows[rows.length - 1];
      const from = (lr && lr.to === cur && fi[lr.from] !== undefined) ? lr.from : 'Before history';
      lb.left[from] = (lb.left[from] || 0) + 1;
    }
    // movement inside the period: each college counted once, by its last change
    const org = resolve(e['Org ID']);
    rows.forEach(r => {
      const d = (r.on || '').slice(0, 10);
      if (!d || d < range.from || d > range.to) return;
      const k = kindOf(r.to), ti = fi[r.to], ff = fi[r.from];
      if (r.from === '' && r.to === first) return; // a new engagement is not movement
      if (k === 'Lost') outcome[org] = { bucket: 'lost', stage: r.to };
      else if (k === 'Won') outcome[org] = { bucket: 'signed', stage: r.to };
      else if (k === 'Open') {
        const ahead = (ff !== undefined) ? ti > ff : (r.from === '' ? ti > 0 : false);
        if (ahead) outcome[org] = { bucket: 'ahead', stage: r.to };
      }
    });
  });
  const mv = { ahead: [], signed: [], lost: [] };
  Object.keys(outcome).forEach(org => { mv[outcome[org].bucket].push({ org: orgName(org), stage: outcome[org].stage }); });
  Object.keys(mv).forEach(k => mv[k].sort((a, b) => a.org.localeCompare(b.org)));
  return {
    total: E.length, range: range, today: today,
    funnel: funnelStages.map((s, i) => ({ stage: s, kind: kindOf(s), reached: reached[i], now: nowHere[i], pct: i === 0 ? null : (reached[i - 1] ? Math.round(reached[i] / reached[i - 1] * 100) : 0) })),
    lost: stages.filter(s => kindOf(s) === 'Lost').map(s => ({ stage: s, total: (lostBy[s] || { total: 0 }).total, left: lostBy[s] ? lostBy[s].left : {} })),
    movement: mv,
    productNames: Object.keys(prods).map(k => prods[k]).sort((a, b) => a.localeCompare(b)),
    stageOrder: stages
  };
}
// The breakdown is shown only when the log names the stage for every college that left; otherwise just the total is shown.
function leftText(lost, order) {
  if (!lost.total || lost.left['Before history']) return '';
  return order.filter(s => lost.left[s]).map(s => lost.left[s] + ' after ' + s).join(', ');
}
// ==== PURE END ====

/* ==== BEGIN I02 — Pipeline funnel ============================================= */
/* @spec I02
 * Feature: Pipeline funnel
 * Status: Modified in v2
 * Screen: Insights > Pipeline
 * Delta: New first view of the Insights tool: one bar for each Open or Won stage, in the order of the Lists tab, showing how many colleges reached that stage, the conversion from the previous stage and how many are there now. Colleges that left are shown below the bars. Meant to be read at a glance or shared as a screenshot. In v2 the college count is removed from the heading (it always equals the first bar), and a line under the heading names the campaign and the products in it.
 * Validations: Form: none. Stages are never written in the tool; if the Stage list has no Open or Won stage the tool says so.
 * Calculations: An engagement has reached a stage when the furthest Open or Won stage it has been in, taken from the Stage History log and its current stage, is that stage or later [CONFIRMED]. Reached is therefore never lower for a later stage [CONFIRMED]. Conversion is the stage's reached count as a percentage of the previous bar's reached count [CONFIRMED]. Now here is the number of engagements whose current stage is that stage [CONFIRMED]. An engagement with no Stage History rows is treated as having one row for its current stage dated by Stage Changed On [CONFIRMED]. A Lost engagement with no history counts only at the first stage [CONFIRMED]. The funnel is always as of today and is not affected by the period [CONFIRMED]. Left here: for each Lost stage, the stage each engagement was in just before it moved to Lost, named exactly as in the Lists tab [CONFIRMED]. The breakdown is shown only when the log names that stage for every college that left; otherwise only the total is shown [CONFIRMED]. The products line lists the distinct product names of the engagements in the view, in alphabetical order, joined by commas [CONFIRMED]. The count of colleges is not shown in the heading because the first bar always equals it [CONFIRMED]. Bars: first stage soft purple, other Open stages purple, Won green [CONFIRMED].
 * Dependencies: Engagements; Stage History; Lists (Company): Stage, Stage Kind; Products; F23 (getInsights); F22 (log written by the CRM); I05 (campaign filter); Products.
 * @end */
function funnelHtml(r) {
  if (!r.funnel.length) return '<div class="card"><div class="empty">The Stage list has no Open or Won stage yet.</div></div>';
  const top = Math.max(r.funnel[0].reached, 1);
  const bars = r.funnel.map((f, i) => '<div class="fn-row"><div class="fn-head"><div class="fn-name">' + esc(f.stage) + '</div><div class="fn-num">' + f.reached + (f.pct === null ? '' : '<small>' + f.pct + '%</small>') + '</div></div>'
    + '<div class="fn-track"><div class="fn-bar' + (f.kind === 'Won' ? ' won' : i === 0 ? ' first' : '') + '" style="width:' + Math.max(f.reached / top * 100, f.reached ? 3 : 0) + '%"></div></div>'
    + '<div class="fn-sub">' + (f.now ? f.now + ' there now' : 'None there now') + '</div></div>').join('');
  const lost = r.lost.filter(l => l.total).map(l => '<div class="lost-line"><b>' + esc(l.stage) + ' · ' + l.total + '</b>' + (leftText(l, r.funnel.map(f => f.stage)) ? '<div class="fn-sub">' + esc(leftText(l, r.funnel.map(f => f.stage))) + '</div>' : '') + '</div>').join('');
  const camp = campaignLabel() || 'All campaigns';
  return '<div class="card"><div class="card-title">Pipeline</div><div class="asof">' + esc([camp].concat(r.productNames).join(' · ')) + '</div>' + bars + '</div>'
    + (lost ? '<div class="card"><div class="card-title">Left the pipeline</div>' + lost + '</div>' : '');

    + t.map(x => '<div class="col" title="' + escA(x.label + ': ' + fmtMetric(TR.ui.metric, x.value)) + '">' + (showVals ? '<span class="v">' + esc(fmtMetric(TR.ui.metric, x.value, true)) + '</span>' : '')
      + '<div class="b' + (x.value ? '' : ' zero') + '" style="height:' + (max ? Math.round(x.value / max * 100) : 0) + '%"></div></div>').join('')

/* ==== BEGIN I14 — Training: view by =========================================== */
/* @spec I14
 * Feature: Training view by
 * Status: New in v4
 * Screen: Insights > Training > View by
 * Delta: New card that breaks the chosen metric down over the whole period as ranked bars, each with its value and its share of the total. Choose the breakdown from Product, Facilitator, Client, Org type, State, Mode and Fee type (Free or Charged).
 * Validations: Form: none. A breakdown that already has a filter is greyed out and cannot be chosen.
 * Calculations: Bars are ranked from the largest; a value of 0 is not listed [CONFIRMED]. Share is the bar's value as a percentage of the metric's total in view [CONFIRMED]. Several facilitators can share a training: each facilitator is credited the full training, its participants and its hours, and its revenue is split equally between them; so facilitator bars can add up to more than the total, except for revenue [CONFIRMED]. Organisations reached by bars can add up to more than the total, because one organisation can sit under several groups [CONFIRMED]. Org type, State and Client come from the client's organisation record, after an archived record is replaced by its Archived To record; a delivered training with no organisation shows as No organisation [CONFIRMED]. State is free text: values are grouped ignoring upper and lower case and extra spaces and shown in the first spelling met [CONFIRMED]. Fee type is Free when Fee Basis is Free and Charged when it is Per training or Per participant [CONFIRMED]. The first 8 bars are shown, with a Show all choice for the rest [CONFIRMED]. Not offered: Month, Country, Training type, Facilitator level and Source [CONFIRMED].
 * Dependencies: Trainings; Products: Product Name; Facilitators; Orgs: Org Name, Org Type, State, Archived To; I11; I15.
 * @end */
function viewByHtml(recs) {
  const ui = TR.ui, metric = ui.metric, br = breakdown(recs, metric, ui.dim);
  const top = br.rows.length ? br.rows[0].value : 0, shown = ui.showAll ? br.rows : br.rows.slice(0, 8);
  const chips = TR_DIMS.map(d => {
    const off = ui.filters[d[0]] !== undefined;
    return '<button class="chip' + (ui.dim === d[0] ? ' selected' : '') + (off ? ' dim-off' : '') + '"' + (off ? ' disabled aria-disabled="true"' : '') + ' data-act="tdim" data-v="' + d[0] + '">' + d[1] + '</button>';
  }).join('');
  const rows = shown.map(r => '<button class="vb-row" data-act="tfilter" data-v="' + escA(r.label) + '" aria-label="Filter to ' + escA(r.label) + '"><div class="vb-head"><span class="vb-name">' + esc(r.label) + '</span><span class="vb-num">' + esc(fmtMetric(metric, r.value)) + '<small>' + Math.round(r.share * 100) + '%</small></span></div>'
    + '<div class="vb-track"><div class="vb-bar" style="width:' + Math.max(top ? r.value / top * 100 : 0, 2) + '%"></div></div></button>').join('');
  const name = TR_METRICS.filter(m => m[0] === metric)[0][1], dn = TR_DIMS.filter(d => d[0] === ui.dim)[0][1];
  return '<div class="card"><div class="card-title">' + esc(name) + ' by ' + esc(dn.toLowerCase()) + '</div><div class="dimchips">' + chips + '</div>'
    + (rows || '<div class="empty" style="padding:18px 0">Nothing delivered in this period.</div>')
    + (br.rows.length > 8 ? '<button class="link-btn" data-act="tall">' + (ui.showAll ? 'Show fewer' : 'Show all ' + br.rows.length) + '</button>' : '') + '</div>';
}
ACTS.tdim = el => { if (el.disabled) return; TR.ui.dim = el.dataset.v; TR.ui.showAll = false; render(); };
ACTS.tall = () => { TR.ui.showAll = !TR.ui.showAll; render(); };

/* @spec I15
 * Feature: Training tap to filter
 * Status: New in v4
 * Screen: Insights > Training
 * Delta: New: tapping a bar adds a removable chip above the tiles, and the tiles, trend, bars and trainings list all follow it. Filters stack, so QPR and then Mumbai shows QPR in Mumbai.

 * Dependencies: I14; I16.
 * @end */
function filterChipsHtml() {
  const f = TR.ui.filters, keys = TR_DIMS.map(d => d[0]).filter(k => f[k] !== undefined);
  if (!keys.length) return '';
  return '<div class="fchips">' + keys.map(k => '<button class="fchip" data-act="tunfilter" data-v="' + k + '" aria-label="Remove filter ' + escA(f[k]) + '"><small>' + esc(TR_DIMS.filter(d => d[0] === k)[0][1]) + '</small> ' + esc(f[k]) + ' <span class="x">×</span></button>').join('')
    + (keys.length > 1 ? '<button class="link-btn" data-act="tclear">Clear all</button>' : '') + '</div>';
}
ACTS.tfilter = el => {
  const ui = TR.ui; ui.filters[ui.dim] = el.dataset.v;
  const next = TR_DIMS.map(d => d[0]).filter(k => ui.filters[k] === undefined);
  if (next.length) ui.dim = next[0];
  ui.showAll = false; render();
};
ACTS.tunfilter = el => { delete TR.ui.filters[el.dataset.v]; TR.ui.showAll = false; render(); };
ACTS.tclear = () => { TR.ui.filters = {}; render(); };

/* ==== BEGIN I16 — Training: see trainings ===================================== */
/* @spec I16
 * Feature: Training see trainings
 * Status: New in v4
 * Screen: Insights > Training > See trainings
 * Delta: New list of the delivered trainings behind the numbers on screen: date, client, product, participants and revenue.
 * Validations: Form: none. The list is read only.
 * Calculations: The list shows the delivered trainings in the period that match the filters, newest first by last day [CONFIRMED]. The date shown is the Start Date, or Start to End for a longer training [CONFIRMED]. Revenue is the training's own revenue. When a Facilitator filter is on, the totals share revenue equally between facilitators, and a line says so [CONFIRMED]. A training with no organisation shows No organisation [CONFIRMED].
 * Dependencies: Trainings; I10; I15.
 * @end */
function listHtml(recs, trainingsById) {
  const rows = recs.slice().sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const fl = TR.ui.filters;
  const dates = r => { const t = trainingsById[r.id] || {}; return t['End Date'] && t['End Date'] !== t['Start Date'] ? fmtShort(t['Start Date']) + ' – ' + fmtD(t['End Date']) : fmtD(t['Start Date'] || r.date); };
  return filterChipsHtml() + '<div class="count-line">' + esc(plural(rows.length, 'training')) + '</div>'
    + (fl.facilitator ? '<div class="notice">Revenue in the totals is shared equally between the facilitators of a training; each training below shows its full revenue.</div>' : '')
    + '<div class="list">' + (rows.length ? rows.map(r => '<div class="row"><div class="row-top"><div class="row-title">' + esc(r.orgName) + '</div><div class="muted small">' + esc(dates(r)) + '</div></div>'
      + '<div class="row-sub">' + esc(r.productName) + ' · ' + esc(plural(r.part, 'participant')) + (r.revFull ? ' · ' + esc(fmtRs(r.revFull)) : '') + '</div></div>').join('') : '<div class="empty">Nothing delivered in this period.</div>') + '</div>'
    + '<button class="btn" data-act="tlistback">Back to the numbers</button>';
}
ACTS.tlist = () => { TR.ui.list = true; render(); window.scrollTo(0, 0); };
ACTS.tlistback = () => { TR.ui.list = false; render(); window.scrollTo(0, 0); };

/* ==== BEGIN I17 — Training: missing figures notice ============================ */
/* @spec I17
 * Feature: Training missing figures notice
 * Status: New in v4
 * Screen: Insights > Training (under the tiles)
 * Delta: New small notice that appears only when some delivered trainings in view have no participant count or no hours.
 * Validations: Form: none.
 * Calculations: A delivered training with a blank Actual Participants or a blank Hours counts as 0 for that figure; no estimate is made and the product's hours are not used [CONFIRMED]. The notice gives the number of such trainings in the numbers on screen, after the filters [CONFIRMED]. Trainings entered before the End Date and Hours fields existed, with a blank End Date, count as one-day trainings on their Start Date until they are edited [CONFIRMED].
 * Dependencies: Trainings: Actual Participants, Hours, End Date; I11.
 * @end */
function noticeHtml(recs) {
  const n = recs.filter(r => r.missing).length;
  return n ? '<div class="notice">' + esc(plural(n, 'delivered training')) + (n === 1 ? ' has' : ' have') + ' no participant count or hours entered, so ' + (n === 1 ? 'it counts' : 'they count') + ' as 0 for those.</div>' : '';
}

};

function start() {
  const p = new URLSearchParams(location.search), ids = Object.keys(VIEWS);
  const linkUrl = id => p.get(VIEWS[id].param) || (VIEWS[id].legacyParam ? p.get(VIEWS[id].legacyParam) : '') || '';
  const fromLink = ids.filter(id => linkUrl(id));
  S.views = {};
  if (fromLink.length) {
    // The link decides which views this company has; addresses remembered for other views are dropped.
    ids.forEach(id => {
      if (fromLink.indexOf(id) >= 0) { const u = linkUrl(id); S.views[id] = { url: u, key: '', data: null }; store.set('', VIEWS[id].lastKey, u); }
      else store.del('', VIEWS[id].lastKey);
    });
    const lg = p.get('logo') || '';
    if (/^https?:\/\//i.test(lg)) store.set('', 'logo', lg);
  } else {
    ids.forEach(id => { const u = store.get('', VIEWS[id].lastKey); if (u) S.views[id] = { url: u, key: '', data: null }; });
  }
  S.logo = store.get('', 'logo') || '';
  if (!availableViews().length) { viewConnect(); return; }
  openView(preferredView());
}
if (typeof document !== 'undefined' && document.getElementById('view')) start();
